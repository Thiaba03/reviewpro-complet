name: Backend Continuous Delivery

on:
  push:
    tags: ["backend-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-package:
    name: Valider et livrer Laravel
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v7.0.1

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - name: Préparer les répertoires Laravel
        run: |
          mkdir -p bootstrap/cache
          mkdir -p storage/framework/cache/data
          mkdir -p storage/framework/sessions
          mkdir -p storage/framework/views
          mkdir -p storage/logs
          chmod -R u+rwX bootstrap/cache storage

      - name: Installer les dépendances de validation
        run: |
          composer install \
            --no-interaction \
            --prefer-dist \
            --no-progress

      - name: Préparer l’environnement de test
        run: |
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate
          php artisan config:clear

      - name: Vérifier les migrations
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan migrate:fresh --force

      - name: Exécuter les tests Laravel
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
        run: |
          php artisan test \
            --log-junit storage/logs/junit-laravel.xml

      - name: Installer uniquement les dépendances de production
        run: |
          composer install \
            --no-dev \
            --no-interaction \
            --prefer-dist \
            --no-progress \
            --optimize-autoloader

      - name: Construire le paquet backend
        run: |
          PACKAGE_DIR="dist/reviewpro-backend"
          rm -rf "$PACKAGE_DIR"
          mkdir -p "$PACKAGE_DIR"

          rsync -a \
            --exclude='.env' \
            --exclude='database.sqlite' \
            --exclude='*.log' \
            app artisan bootstrap composer.json composer.lock config database public resources routes storage vendor \
            "$PACKAGE_DIR/"

          cp .env.example "$PACKAGE_DIR/.env.example"

          mkdir -p "$PACKAGE_DIR/bootstrap/cache"
          mkdir -p "$PACKAGE_DIR/storage/framework/cache/data"
          mkdir -p "$PACKAGE_DIR/storage/framework/sessions"
          mkdir -p "$PACKAGE_DIR/storage/framework/views"
          mkdir -p "$PACKAGE_DIR/storage/logs"

          tar \
            --create \
            --gzip \
            --file dist/reviewpro-backend.tar.gz \
            --directory dist \
            reviewpro-backend

          shasum -a 256 dist/reviewpro-backend.tar.gz \
            > dist/reviewpro-backend.tar.gz.sha256

      - name: Publier les artefacts de livraison
        uses: actions/upload-artifact@v7.0.1
        with:
          name: reviewpro-backend-release
          path: |
            dist/reviewpro-backend.tar.gz
            dist/reviewpro-backend.tar.gz.sha256
            storage/logs/junit-laravel.xml
          if-no-files-found: error
          retention-days: 30

      - name: Créer la GitHub Release
        if: startsWith(github.ref, 'refs/tags/backend-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/reviewpro-backend.tar.gz \
            dist/reviewpro-backend.tar.gz.sha256 \
            --title "ReviewPro Backend ${GITHUB_REF_NAME}" \
            --notes "Version validée automatiquement : migrations, tests Laravel, dépendances de production, paquet et empreinte SHA-256. Le fichier .env et la base locale ne sont pas inclus."
