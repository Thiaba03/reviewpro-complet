name: Model CI CD

on:
  push:
    branches: [main]
    tags: ["ai-v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-model:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v7.0.1

      - name: Installer Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: requirements-ai-test.txt

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements-ai-test.txt

      - name: Vérifier la syntaxe
        run: |
          python -m py_compile ai_service/main.py ai_service/monitoring.py
          python -m py_compile scripts/package_ai_model.py

      - name: Tester le dataset, le modèle et l'API
        run: |
          mkdir -p storage/app/ai
          python -m pytest -v | tee storage/app/ai/pytest-model-results.txt

      - name: Construire le paquet versionné
        run: python scripts/package_ai_model.py

      - name: Publier les preuves de validation
        uses: actions/upload-artifact@v7.0.1
        with:
          name: reviewpro-ai-validation
          path: |
            storage/app/ai/pytest-model-results.txt
            storage/app/ai/pytest-coverage.xml
            dist/reviewpro-ai-model.tar.gz
            dist/reviewpro-ai-model/manifest.json
          if-no-files-found: error
          retention-days: 30

  test-container:
    needs: validate-model
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v7.0.1

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Construire l'image locale
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: Dockerfile.ai
          load: true
          push: false
          tags: reviewpro-ai:test

      - name: Tester le conteneur
        run: |
          docker run --detach --name reviewpro-ai-test --publish 8001:8001 reviewpro-ai:test
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8001/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs reviewpro-ai-test
          exit 1

      - name: Afficher les journaux en cas d'échec
        if: failure()
        run: docker logs reviewpro-ai-test || true

      - name: Arrêter le conteneur
        if: always()
        run: docker rm --force reviewpro-ai-test || true

  publish-image:
    if: startsWith(github.ref, 'refs/tags/ai-v')
    needs: test-container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v7.0.1

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Se connecter au registre GitHub
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraire les métadonnées de l'image
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/thiaba03/reviewpro-ai
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Publier l'image validée
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: Dockerfile.ai
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
