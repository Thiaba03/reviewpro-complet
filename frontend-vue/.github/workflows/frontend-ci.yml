name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Tester et construire Vue
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v7.0.1

      - name: Installer Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Exécuter les tests du frontend
        run: npm test

      - name: Construire la version de production
        run: npm run build

      - name: Publier le frontend construit
        uses: actions/upload-artifact@v7.0.1
        with:
          name: reviewpro-frontend-dist
          path: dist
          if-no-files-found: error
          retention-days: 30
