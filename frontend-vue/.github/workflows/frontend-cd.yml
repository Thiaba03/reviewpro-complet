name: Frontend Continuous Delivery

on:
  push:
    tags: ["frontend-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-package:
    name: Valider et livrer Vue
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v7.0.1

      - name: Installer Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Exécuter les tests du frontend
        run: npm test

      - name: Construire la version de production
        run: npm run build

      - name: Construire le paquet frontend
        run: |
          tar \
            --create \
            --gzip \
            --file reviewpro-frontend-dist.tar.gz \
            dist

          shasum -a 256 reviewpro-frontend-dist.tar.gz \
            > reviewpro-frontend-dist.tar.gz.sha256

      - name: Publier les artefacts de livraison
        uses: actions/upload-artifact@v7.0.1
        with:
          name: reviewpro-frontend-release
          path: |
            reviewpro-frontend-dist.tar.gz
            reviewpro-frontend-dist.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Créer la GitHub Release
        if: startsWith(github.ref, 'refs/tags/frontend-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            reviewpro-frontend-dist.tar.gz \
            reviewpro-frontend-dist.tar.gz.sha256 \
            --title "ReviewPro Frontend ${GITHUB_REF_NAME}" \
            --notes "Version Vue validée automatiquement : tests Vitest et accessibilité, build Vite, paquet de distribution et empreinte SHA-256."
